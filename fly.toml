# fly.toml app configuration file generated for sint-client-dev on 2026-03-07T20:18:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sint-client-dev'
primary_region = 'jnb'

# Runtime: fly secrets set NEXT_PUBLIC_API_BASE_URL=https://your-api.fly.dev
# Build-time (for client bundle): set below or fly deploy --build-arg NEXT_PUBLIC_API_BASE_URL=...
[build]
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
