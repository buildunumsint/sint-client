# fly.toml app configuration file generated for sint-client on 2025-12-27T05:24:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sint-client-dev'
primary_region = 'jnb'

# Env: set via fly secrets set NEXT_PUBLIC_API_BASE_URL=https://your-api.fly.dev
# For client bundle, pass at build: fly deploy --build-arg NEXT_PUBLIC_API_BASE_URL=https://your-api.fly.dev
[build]
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "https://sint-server-dev.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
